name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest --cov=biosigkit --cov-report=term-missing

  minimum-versions:
    name: oldest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install the lowest allowed version of every direct dependency
        run: |
          python -m pip install uv
          uv venv .venv-min
          uv pip install --python .venv-min/bin/python --resolution lowest-direct -e ".[dev]"
      - name: Test
        run: .venv-min/bin/python -m pytest

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  package:
    name: build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean environment and run the demo
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/biosigkit --version
          /tmp/clean/bin/biosigkit sql list
          /tmp/clean/bin/biosigkit demo --out /tmp/demo --subjects 3 --trials-per-level 2
          test -s /tmp/demo/report.md

  package-windows:
    name: build and smoke-test the wheel (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean environment and run the demo
        run: |
          python -m venv clean
          clean/Scripts/python.exe -m pip install dist/*.whl
          clean/Scripts/biosigkit.exe --version
          clean/Scripts/biosigkit.exe sql list
          clean/Scripts/biosigkit.exe demo --out demo --subjects 3 --trials-per-level 2
          test -s demo/report.md
